version: '3.8'

services:
  # ==============================================================================
  # BACKEND SPRING BOOT 3 (Java 17) - Conectado a Supabase PostgreSQL
  # ==============================================================================
  archai-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archai-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres.ajkyjbdtfekejrhjlhca}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-coldice3301.}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      CORS_ALLOWED_ORIGINS: "*"
      ARCHAI_JWT_SECRETO: ${ARCHAI_JWT_SECRETO:-archai_studio_firma_jwt_ciclo1_2026_clave_segura}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  # ==============================================================================
  # FRONTEND REACT + VITE + NGINX
  # ==============================================================================
  archai-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ARCHAI_API_URL: ${VITE_ARCHAI_API_URL:-http://localhost:8000}
    container_name: archai-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - archai-backend
