# ── Servidor y Puerto Dinámico (Render / Railway / AWS / Heroku) ──────────────
server.port=${PORT:8000}
server.address=0.0.0.0
spring.application.name=archai-backend

# ── Base de Datos Dinámica (PostgreSQL en la Nube / Fallback H2 Local) ────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:archai_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Consola H2 (Solo desarrollo offline) ──────────────────────────────────────
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200,*}

# ── JWT (CU-01: token firmado con expiración configurable) ────────────────────
archai.jwt.secreto=${ARCHAI_JWT_SECRETO:archai_studio_firma_jwt_ciclo1_2026_clave_segura}
archai.jwt.expiracion-minutos=${ARCHAI_JWT_EXPIRACION_MINUTOS:480}

# ── Migraciones versionadas de Base de Datos (Flyway) ─────────────────────────
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── Límite de Subida de Archivos XMI / Proyectos ──────────────────────────────
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# ── Inteligencia Artificial Multimodal (CU-07: OCR y Visión de Diagramas) ─────
archai.ia.gemini-api-key=${GEMINI_API_KEY:}
archai.ia.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}

